<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}dm-photo{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500&display=swap" rel="stylesheet" />
    <style>{% include "../static/styles.css" %}</style>
    <script src="/static/htmx.min.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">dm-photo</span>
      </a>
      <nav>
        {% match current_user %}
          {% when Some with (user) %}
            <a href="/gear">Ausrüstung</a>
            <span class="nav-desktop user">{{ user.username }}</span>
            <form method="post" action="/logout" class="inline nav-desktop">
              <button type="submit" class="link">Abmelden</button>
            </form>
            {% if is_admin %}
              <a class="nav-desktop" href="/admin">Admin</a>
            {% endif %}
            <details class="nav-more nav-mobile">
              <summary aria-label="Menü">Mehr</summary>
              <div class="nav-more-panel">
                <span class="user">{{ user.username }}</span>
                {% if is_admin %}
                  <a href="/admin">Admin</a>
                {% endif %}
                <form method="post" action="/logout" class="inline">
                  <button type="submit" class="link">Abmelden</button>
                </form>
              </div>
            </details>
          {% when None %}
            <a href="/login">Anmelden</a>
        {% endmatch %}
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
