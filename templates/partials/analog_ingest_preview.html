<section class="ingest-preview" id="ingest-preview-{{ job.id }}">
  <header class="ingest-preview-head">
    <h3>Vorschau — <code>{{ job.order_number }}</code></h3>
    <p class="muted">Drehen, dann Import bestätigen. {{ images.len() }} Datei(en).</p>
    <p id="preview-feedback" class="preview-feedback muted" aria-live="polite"></p>
  </header>

  {% if images.is_empty() %}
    <p class="empty-state">Keine Bilder im Arbeitsverzeichnis gefunden.</p>
  {% else %}
    <div class="ingest-preview-grid">
      {% for image in images %}
        <article class="ingest-preview-card">
          <img
            class="ingest-preview-img"
            src="/api/analog/ingest/{{ job.id }}/preview/file?path={{ image.relative_path }}&t={{ cache_bust }}"
            alt="{{ image.file_name }}"
            loading="lazy" />
          <p class="ingest-preview-name">{{ image.file_name }}</p>
          <div class="ingest-preview-actions">
            <form
              class="inline-rotate"
              hx-post="/api/analog/ingest/{{ job.id }}/preview/rotate"
              hx-target="#analog-preview-panel"
              hx-swap="innerHTML"
              hx-disabled-elt="find button"
              hx-indicator="find .rotate-spinner">
              <input type="hidden" name="file" value="{{ image.relative_path }}" />
              <input type="hidden" name="direction" value="ccw" />
              <button type="submit" class="secondary touch-target" aria-label="90° gegen den Uhrzeigersinn">
                ↺ Links
              </button>
              <span class="rotate-spinner htmx-indicator" aria-hidden="true">…</span>
            </form>
            <form
              class="inline-rotate"
              hx-post="/api/analog/ingest/{{ job.id }}/preview/rotate"
              hx-target="#analog-preview-panel"
              hx-swap="innerHTML"
              hx-disabled-elt="find button"
              hx-indicator="find .rotate-spinner">
              <input type="hidden" name="file" value="{{ image.relative_path }}" />
              <input type="hidden" name="direction" value="cw" />
              <button type="submit" class="secondary touch-target" aria-label="90° im Uhrzeigersinn">
                ↻ Rechts
              </button>
              <span class="rotate-spinner htmx-indicator" aria-hidden="true">…</span>
            </form>
          </div>
        </article>
      {% endfor %}
    </div>
  {% endif %}

  <div class="ingest-preview-footer">
    <button
      type="button"
      class="touch-target"
      hx-post="/api/analog/ingest/{{ job.id }}/preview/confirm"
      hx-target="#analog-ingest-list"
      hx-swap="innerHTML"
      hx-confirm="Import starten? Die Bilder werden mit Metadaten versehen und hochgeladen.">
      Import bestätigen
    </button>
    <button
      type="button"
      class="secondary touch-target"
      hx-post="/api/analog/ingest/{{ job.id }}/preview/cancel"
      hx-target="#analog-ingest-list"
      hx-swap="innerHTML"
      hx-confirm="Import wirklich abbrechen? Die heruntergeladenen Dateien werden gelöscht.">
      Abbrechen
    </button>
  </div>
</section>
