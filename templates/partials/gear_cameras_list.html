{% if cameras.is_empty() %}
  <p class="empty-state">
    <strong>Noch keine Kameras</strong>
    Bezeichnung oben eingeben und hinzufügen.
  </p>
{% else %}
  <ul class="gear-list">
    {% for camera in cameras %}
      <li class="gear-item" id="gear-camera-{{ camera.id }}">
        <div class="gear-main">
          <h3 class="gear-name">{{ camera.label }}</h3>
          <p class="gear-meta-line">Gespeichert {{ camera.created_at.format("%d.%m.%Y") }}</p>
        </div>
        <div class="gear-actions">
          <button
            type="button"
            class="ghost small"
            hx-delete="/api/gear/cameras/{{ camera.id }}"
            hx-confirm="Kamera „{{ camera.label }}“ wirklich löschen?"
            hx-target="#gear-cameras-list"
            hx-swap="innerHTML">
            Löschen
          </button>
        </div>
      </li>
    {% endfor %}
  </ul>
{% endif %}
