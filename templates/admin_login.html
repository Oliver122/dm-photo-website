{% extends "base.html" %}

{% block title %}Admin — Anmelden{% endblock %}

{% block content %}
  <header class="page-head">
    <h1>Admin-Anmeldung</h1>
    <p class="page-lead">Passwort für den Admin-Bereich eingeben.</p>
  </header>
  {% if let Some(err) = error %}
    <p class="error" role="alert">{{ err }}</p>
  {% endif %}
  <form method="post" action="/admin/login" class="auth-admin">
    <label class="field">
      <span>Passwort</span>
      <input type="password" name="password" autocomplete="current-password" required />
    </label>
    <button type="submit">Als Admin anmelden</button>
  </form>
{% endblock %}
